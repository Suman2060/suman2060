# Save this file in your profile repo at: .github/workflows/bike.yml
name: Generate Mountain Bike Graph

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the bike graph
        run: |
          mkdir -p dist
          python3 .github/scripts/generate_bike.py "${{ github.repository_owner }}" dist/mtb-bike.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
