<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9CE6"/>
      <stop offset="0.55" stop-color="#8FD3F4"/>
      <stop offset="1" stop-color="#FFF1D0"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="14" fill="#fff"/>
      <ellipse cx="-26" cy="5" rx="24" ry="11" fill="#fff"/>
      <ellipse cx="28" cy="5" rx="26" ry="11" fill="#fff"/>
      <ellipse cx="0" cy="-8" rx="22" ry="12" fill="#fff"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="300" fill="url(#sky)"/>

  <!-- Sun with pulsing glow -->
  <circle cx="905" cy="68" r="40" fill="#FFE082" opacity="0.35">
    <animate attributeName="r" values="40;52;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.15;0.35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="905" cy="68" r="28" fill="#FFD54F"/>

  <!-- Drifting clouds -->
  <g opacity="0.95">
    <g><animateTransform attributeName="transform" type="translate" from="-120 52" to="1120 52" dur="70s" repeatCount="indefinite"/><use href="#cloud"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-120 95" to="1120 95" dur="95s" begin="-40s" repeatCount="indefinite"/><use href="#cloud" transform="scale(0.8)"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-120 30" to="1120 30" dur="120s" begin="-85s" repeatCount="indefinite"/><use href="#cloud" transform="scale(0.6)"/></g>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#2A4B6B" stroke-width="2.5" stroke-linecap="round">
    <path d="M0,0 q7,-8 14,0 q7,-8 14,0">
      <animateTransform attributeName="transform" type="translate" from="-40 85" to="1040 60" dur="32s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 q6,-6 12,0 q6,-6 12,0">
      <animateTransform attributeName="transform" type="translate" from="-90 105" to="990 80" dur="32s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Far mountains -->
  <path d="M0,300 L0,190 L70,140 L110,165 L160,120 L230,175 L300,200 L420,215 L560,215 L680,200 L760,170 L830,125 L890,160 L940,135 L1000,175 L1000,300 Z" fill="#A9C4DD"/>
  <g fill="#FFFFFF">
    <polygon points="160,120 140,138 150,134 159,144 168,134 178,141 183,138"/>
    <polygon points="830,125 802,143 813,139 822,150 832,139 842,148 851,138 861,143"/>
    <polygon points="940,135 910,150 921,147 930,155 940,147 950,156 958,148 967,153"/>
    <polygon points="70,140 45,158 55,154 63,162 71,154 80,163 88,155 99,158"/>
  </g>

  <!-- Mid mountains -->
  <path d="M0,300 L0,230 L90,185 L140,210 L210,170 L290,225 L380,245 L620,245 L700,225 L780,195 L860,160 L930,205 L1000,190 L1000,300 Z" fill="#6C8FB5"/>
  <g fill="#F4FAFF">
    <polygon points="210,170 172,192 184,187 195,197 207,188 220,198 231,189 242,192"/>
    <polygon points="860,160 810,182 823,177 836,187 849,178 862,189 875,179 886,186 894,182"/>
    <polygon points="90,185 54,203 66,199 77,207 90,199 103,208 114,200 126,203"/>
  </g>

  <!-- Green valley hills -->
  <path d="M0,300 L0,262 Q150,235 300,262 T560,270 T800,258 T1000,255 L1000,300 Z" fill="#8BC34A"/>
  <path d="M0,300 L0,284 Q200,262 400,284 T800,280 T1000,275 L1000,300 Z" fill="#558B2F"/>

  <!-- Pine trees -->
  <g fill="#2E7D32">
    <polygon points="60,238 49,258 71,258"/><polygon points="60,248 46,270 74,270"/>
    <polygon points="90,246 81,262 99,262"/><polygon points="90,254 78,274 102,274"/>
    <polygon points="935,236 924,256 946,256"/><polygon points="935,246 921,268 949,268"/>
    <polygon points="965,242 956,258 974,258"/><polygon points="965,250 953,272 977,272"/>
  </g>

  <!-- Prayer flags string -->
  <line x1="20" y1="226" x2="320" y2="238" stroke="#5D4037" stroke-width="2"/>
  <g>
    <g transform="translate(44,228)"><rect width="22" height="16" fill="#1E88E5"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(84,230)"><rect width="22" height="16" fill="#FFFFFF"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" begin="-0.4s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(124,231)"><rect width="22" height="16" fill="#E53935"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" begin="-0.8s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(164,233)"><rect width="22" height="16" fill="#43A047"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" begin="-1.2s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(204,235)"><rect width="22" height="16" fill="#FDD835"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" begin="-1.6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(244,236)"><rect width="22" height="16" fill="#1E88E5"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" begin="-0.2s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(284,238)"><rect width="22" height="16" fill="#FFFFFF"><animateTransform attributeName="transform" type="skewY" values="0;9;0;-7;0" dur="2s" begin="-0.6s" repeatCount="indefinite"/></rect></g>
  </g>

  <!-- Name + title -->
  <g font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" text-anchor="middle">
    <text x="500" y="112" font-size="58" font-weight="900" fill="#FFFFFF" stroke="#1F5F8B" stroke-width="8" stroke-linejoin="round" paint-order="stroke" opacity="0">
      SUMAN DANGOL
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="154" font-size="20" font-weight="800" letter-spacing="7" fill="#14486B" opacity="0">
      FULL STACK DEVELOPER
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
